version: 2

project_name: switch-screenshots

before:
  hooks:
    - go mod tidy

builds:
  - id: switch-screenshots
    main: ./cmd/switch-screenshots
    binary: switch-screenshots
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

release:
  github:
    owner: lechip
    name: switch-screenshots  # explicit name so GoReleaser never derives it from the git remote
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## switch-screenshots {{ .Tag }}

    Cross-platform Nintendo Switch screenshot organizer.

    Pick the archive matching your OS and architecture below.
  footer: |
    **Verify downloads**: `sha256sum -c checksums.txt`
